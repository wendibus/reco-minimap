# Windows and Linux downloads (zip with start script). Runs only when started by hand or for a
# version tag; the zips are attached to the workflow run (and to the release of that tag).
# Started by hand with a tag (e.g. v0.23.0), that version is built and its release gets the zips.
name: platform zips
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build and attach to (empty: just build the branch)'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  zip:
    strategy:
      matrix:
        include:
          - os: windows-latest
            ort_asset: win-x64
          - os: ubuntu-22.04
            ort_asset: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # The official onnxruntime wheel from PyPI carries the same runtime library as the
      # GitHub release archives (onnxruntime/capi/), with LICENSE and ThirdPartyNotices beside it.
      - name: ONNX Runtime (newest release, from PyPI)
        run: |
          if [[ "${{ matrix.ort_asset }}" == win-x64 ]]; then PLAT=(--platform win_amd64); else PLAT=(--platform manylinux_2_28_x86_64 --platform manylinux_2_27_x86_64); fi
          python -m pip download onnxruntime --no-deps --only-binary :all: "${PLAT[@]}" --python-version 3.12 -d ort
          (cd ort && python -m zipfile -e onnxruntime-*.whl .)
          if [[ "${{ matrix.ort_asset }}" == win-x64 ]]; then LIB="$PWD/ort/onnxruntime/capi/onnxruntime.dll"; else LIB="$(ls $PWD/ort/onnxruntime/capi/libonnxruntime.so.* | head -1)"; fi
          test -f "$LIB"
          echo "RECO_ORT_LIB=$LIB" >> "$GITHUB_ENV"
      - name: Build and zip
        run: scripts/package-platform.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.ort_asset }}
          path: dist/*.zip
      - name: Attach to the release of this tag
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # the tag is pushed a moment before its release exists: wait for it (up to 10 minutes)
        run: |
          for i in $(seq 60); do gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 10; done
          gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
