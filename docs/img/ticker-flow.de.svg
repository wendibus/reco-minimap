<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 624" width="1100" height="624" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Live ticker">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5a73"/></marker></defs>
<rect width="1100" height="624" fill="#ffffff"/>
<rect x="10" y="22" width="1080" height="316" rx="18" fill="#f1f6fb" stroke="#c5d6e6" stroke-width="2"/>
<text x="30" y="48" font-size="14" font-weight="700" fill="#4a6b86">Auf deinem Rechner (Spieltag)</text>
<rect x="30" y="66" width="170" height="104" rx="12" fill="#e8f0f8" stroke="#7da2c4" stroke-width="2"/><text x="115.0" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">Kamera</text><text x="115.0" y="134" text-anchor="middle" font-size="13" fill="#2b3f50">Reco-Panoramavideo</text>
<rect x="240" y="66" width="200" height="104" rx="12" fill="#e3f3ea" stroke="#6fb48a" stroke-width="2"/><text x="340.0" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">reco-minimap live</text><text x="340.0" y="126" text-anchor="middle" font-size="13" fill="#2b3f50">erkennt Wechsel und</text><text x="340.0" y="143" text-anchor="middle" font-size="13" fill="#2b3f50">Spielsituationen</text>
<rect x="480" y="66" width="200" height="104" rx="12" fill="#fff3d6" stroke="#d9a93a" stroke-width="2"/><text x="580.0" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">Freigabe (optional)</text><text x="580.0" y="126" text-anchor="middle" font-size="13" fill="#2b3f50">du gibst jeden Eintrag</text><text x="580.0" y="143" text-anchor="middle" font-size="13" fill="#2b3f50">frei; nur dieser Rechner</text>
<rect x="720" y="66" width="340" height="104" rx="12" fill="#e3f3ea" stroke="#6fb48a" stroke-width="2"/><text x="890.0" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">Öffentlicher Ticker</text><text x="890.0" y="126" text-anchor="middle" font-size="13" fill="#2b3f50">nur Nummern, oder Namen, wenn du sie</text><text x="890.0" y="143" text-anchor="middle" font-size="13" fill="#2b3f50">erlaubst</text>
<polyline points="202,118 238,118" fill="none" stroke="#3b5a73" stroke-width="2.5" marker-end="url(#ah)"/>
<polyline points="442,118 478,118" fill="none" stroke="#3b5a73" stroke-width="2.5" marker-end="url(#ah)"/>
<polyline points="682,118 718,118" fill="none" stroke="#3b5a73" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="480" y="232" width="200" height="84" rx="12" fill="#e8f0f8" stroke="#7da2c4" stroke-width="2"/><text x="580.0" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">Handys im selben</text><text x="580.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">WLAN</text><text x="580.0" y="300" text-anchor="middle" font-size="13" fill="#2b3f50">http://&lt;Rechner&gt;:8765/ticker</text>
<rect x="720" y="232" width="340" height="84" rx="12" fill="#e3f3ea" stroke="#6fb48a" stroke-width="2"/><text x="890.0" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">Sender</text><text x="890.0" y="282" text-anchor="middle" font-size="13" fill="#2b3f50">schreibt ticker.json und lädt sie per SFTP</text><text x="890.0" y="299" text-anchor="middle" font-size="13" fill="#2b3f50">/ FTP / WebDAV hoch</text>
<polyline points="760,172 760,202 580,202 580,230" fill="none" stroke="#3b5a73" stroke-width="2.5" marker-end="url(#ah)"/>
<polyline points="890,172 890,230" fill="none" stroke="#3b5a73" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="10" y1="372" x2="1090" y2="372" stroke="#8aa3b8" stroke-width="2" stroke-dasharray="3 8"/>
<text x="1085" y="365" text-anchor="end" font-size="13" font-weight="700" fill="#8aa3b8">Internet</text>
<polyline points="890,318 890,410" fill="none" stroke="#3b5a73" stroke-width="2.5" marker-end="url(#ah)"/><text x="902" y="366" font-size="12.5" fill="#3b5a73" font-style="italic">eine kleine Datei</text>
<rect x="720" y="412" width="340" height="80" rx="12" fill="#fff3d6" stroke="#d9a93a" stroke-width="2"/><text x="890.0" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">Dein Webspace</text><text x="890.0" y="460" text-anchor="middle" font-size="13" fill="#2b3f50">nur statische Dateien: ticker.json,</text><text x="890.0" y="477" text-anchor="middle" font-size="13" fill="#2b3f50">ticker.js, ticker.html</text>
<rect x="720" y="522" width="340" height="88" rx="12" fill="#e8f0f8" stroke="#7da2c4" stroke-width="2"/><text x="890.0" y="546" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">Besucher</text><text x="890.0" y="566" text-anchor="middle" font-size="13" fill="#2b3f50">deine Seite zeigt das Widget oder einen</text><text x="890.0" y="582" text-anchor="middle" font-size="13" fill="#2b3f50">iframe; es liest ticker.json alle 3</text><text x="890.0" y="600" text-anchor="middle" font-size="13" fill="#2b3f50">Sekunden</text>
<polyline points="890,494 890,520" fill="none" stroke="#3b5a73" stroke-width="2.5" marker-end="url(#ah)"/><text x="902" y="513" font-size="12.5" fill="#3b5a73" font-style="italic">Besucher öffnen deine Seite</text>
<rect x="30" y="412" width="640" height="198" rx="12" fill="#f6f9fc" stroke="#c5d6e6" stroke-width="2"/><text x="350.0" y="499" text-anchor="middle" font-size="16" font-weight="700" fill="#10202e">Auf dem Server ist nichts zu installieren</text><text x="350.0" y="519" text-anchor="middle" font-size="13" fill="#2b3f50">Kein PHP, keine Datenbank, kein Login. Positionen, der Hub und die Freigabe-Seite</text><text x="350.0" y="536" text-anchor="middle" font-size="13" fill="#2b3f50">verlassen deinen Rechner nie; nur freigegebene Einträge erreichen den Webspace.</text>
</svg>