<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Reco Minimap</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--muted:#6e6e73;--sep:#d1d1d6;--accent:#0a84ff;--good:#248a3d;--warn:#b25000}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--muted:#98989d;--sep:#38383a;--accent:#0a84ff;--good:#30d158;--warn:#ff9f0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px 24px;-webkit-tap-highlight-color:transparent}
h1{font-size:20px;margin:4px 4px 12px;display:flex;align-items:center;gap:8px}
h1 .open{margin-left:auto;font-size:14px;font-weight:600;color:var(--warn)}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:18px 4px 6px;text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.head b{font-size:22px}
.head .meta{color:var(--muted);font-size:14px;margin-left:auto;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--sep);vertical-align:-1px}
.lab{font-size:13px;color:var(--muted);margin:8px 2px 6px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.nums button{min-height:56px;border-radius:12px;border:1px solid var(--sep);background:none;color:var(--ink);font:inherit;font-size:21px;font-weight:700;padding:4px}
.nums button small{display:block;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums button.sug{border:2px solid var(--accent)}
.nums button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.nums button.on small{color:#fff}
.nums button.unk{font-size:15px;font-weight:600}
.nums button:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--sep);font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.row .who{margin-left:auto;font-weight:700}
.row button{border:0;background:none;color:var(--accent);font:inherit;padding:4px 0 4px 8px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--sep)}
.bar button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--sep);background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.bar button:disabled{opacity:.35}
body{padding-bottom:88px}
.off{background:var(--warn);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:none;font-size:14px}
</style></head>
<body>
<h1><span id="title"></span><span class="open" id="open"></span></h1>
<div class="off" id="off"></div>
<div id="now"></div>
<h2 id="recentLab"></h2>
<div class="card" id="recent"></div>
<div class="bar"><button id="undo" type="button" disabled></button><button id="redo" type="button" disabled></button></div>
<script src="/i18n.js"></script>
<script>
const KEY = new URLSearchParams(location.search).get('key') || '';
const $ = id => document.getElementById(id);
let data = null, editing = null, lastTop = null, busy = false, lastText = '';
// undo / redo of the taps on this phone: each step knows the value before and after ('auto' = not picked)
const undo = [], redo = [];
$('undo').textContent = '↶ ' + T('pick.undo');
$('redo').textContent = T('pick.redo') + ' ↷';
const bar = () => { $('undo').disabled = !undo.length || busy; $('redo').disabled = !redo.length || busy; };
async function send(sid, n) {
  busy = true; bar();
  try { await fetch(`/pick/choose?key=${encodeURIComponent(KEY)}&sid=${sid}&n=${n}`, {method: 'POST'}); }
  finally { busy = false; await poll(); bar(); }
}
const valueOf = c => !c || !c.picked ? 'auto' : (c.number == null ? '' : String(c.number));
document.title = T('pick.title');
$('title').textContent = T('pick.title');
$('recentLab').textContent = T('pick.recent');
$('off').textContent = T('pick.offline');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const teamName = k => (data?.config?.teams?.[k]) || T('team.' + k);
const nameOf = (team, n) => data?.config?.players?.[team]?.[String(n)] || '';
const clock = s => s == null ? '' : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const kind = c => c.kind === 'free_throw' ? T('pick.kind_free_throw') : T('pick.kind_' + c.points);
const swatch = k => `<span class="sw" style="background:${k === 'home' ? 'var(--home,#fff)' : 'var(--away,#333)'}"></span>`;

function numBtn(c, n, sug) {
  const on = c.picked && c.number === n, nm = nameOf(c.team, n);
  return `<button class="${sug ? 'sug' : ''}${on ? ' on' : ''}" data-sid="${c.sid}" data-n="${n}">#${n}${nm ? `<small>${esc(nm)}</small>` : ''}</button>`;
}
function cardHtml(c) {
  const roster = (data.roster?.[c.team] || []).filter(n => !c.candidates.includes(n));
  return `<div class="card"><div class="head">${swatch(c.team)}<b>${esc(teamName(c.team))}</b><span>${esc(kind(c))} · ${c.to}</span><span class="meta">${clock(c.clock)}</span></div>
    ${c.candidates.length ? `<div class="lab">${T('pick.suggested')}</div><div class="nums">${c.candidates.map(n => numBtn(c, n, true)).join('')}</div>` : ''}
    <div class="lab">${T('pick.roster')}</div><div class="nums">${roster.map(n => numBtn(c, n, false)).join('')}
    <button class="unk${c.picked && c.number == null ? ' on' : ''}" data-sid="${c.sid}" data-n="">${T('pick.unknown')}</button></div></div>`;
}
function render() {
  if (!data) return;
  const cards = data.cards || [], open = cards.filter(c => !c.picked);
  $('open').textContent = open.length ? T('pick.open', {n: open.length}) : '';
  // the card being worked on: one opened for a change, else the oldest open one
  const top = cards.find(c => c.sid === editing) || open[open.length - 1] || null;
  if (top && top.sid !== lastTop && navigator.vibrate) navigator.vibrate(60);
  lastTop = top ? top.sid : null;
  $('now').innerHTML = top ? cardHtml(top) : `<div class="card empty">${T('pick.waiting')}</div>`;
  const done = cards.filter(c => c !== top);
  $('recent').innerHTML = done.length ? done.map(c => `<div class="row">${swatch(c.team)}<span>${clock(c.clock)}</span><span>${esc(kind(c))} · ${c.to}</span>
    <span class="who">${c.picked ? (c.number != null ? '#' + c.number : T('pick.unknown')) : '…'}</span><button data-edit="${c.sid}">${T('pick.change')}</button></div>`).join('') : `<div class="empty">–</div>`;
  $('recentLab').style.display = $('recent').style.display = done.length ? '' : 'none';
}
async function poll() {
  try {
    const r = await fetch(`/pick.json?key=${encodeURIComponent(KEY)}`, {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    // redraw only on a change: buttons that are rebuilt under a finger can swallow the tap
    if (text === lastText) { $('off').style.display = 'none'; return; }
    lastText = text;
    data = JSON.parse(text);
    const c = data.config || {};
    if (c.colors) { document.documentElement.style.setProperty('--home', c.colors.home); document.documentElement.style.setProperty('--away', c.colors.away); }
    $('off').style.display = 'none';
    if (!busy) render();
  } catch (e) { $('off').style.display = 'block'; }
}
document.addEventListener('click', async e => {
  const ed = e.target.closest('[data-edit]');
  if (ed) { editing = +ed.dataset.edit; render(); window.scrollTo({top: 0, behavior: 'smooth'}); return; }
  if (e.target.closest('#undo')) { const s = undo.pop(); if (s) { redo.push(s); editing = s.sid; await send(s.sid, s.before); } return; }
  if (e.target.closest('#redo')) { const s = redo.pop(); if (s) { undo.push(s); editing = null; await send(s.sid, s.after); } return; }
  const b = e.target.closest('button[data-sid]');
  if (!b || busy) return;
  const sid = +b.dataset.sid, card = (data?.cards || []).find(c => c.sid === sid);
  undo.push({sid, before: valueOf(card), after: b.dataset.n});
  if (undo.length > 50) undo.shift();
  redo.length = 0;
  editing = null;
  await send(sid, b.dataset.n);
});
fetch('/config.json').then(r => r.json()).then(c => { document.documentElement.style.setProperty('--home', c.home || '#fff'); document.documentElement.style.setProperty('--away', c.away || '#333'); }).catch(() => {});
poll(); setInterval(poll, 1500);
</script>
</body></html>
