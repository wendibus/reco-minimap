<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>reco-minimap</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/theme.css"><style>
html,body{height:100%;margin:0}
#app{display:grid;grid-template-columns:1fr 360px;height:100%}
#main{display:flex;flex-direction:column;min-width:0;background:var(--stage)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:crosshair}
canvas#cv{position:absolute;inset:0;width:100%;height:100%}
#banner{position:absolute;left:12px;top:12px;right:12px;padding:8px 12px;border-radius:9px;background:rgba(0,0,0,.66);color:#fff;font-size:12.5px;pointer-events:none}
#coords{position:absolute;right:10px;bottom:8px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-variant-numeric:tabular-nums;pointer-events:none}
#preview{height:28%;min-height:140px;max-height:320px;border-top:.5px solid var(--sep);display:flex;flex-direction:column}
#preview p{color:#c8c8cc;padding:6px 12px 0}
#prevWrap{flex:1;min-height:0;padding:6px 12px 10px;display:flex;align-items:center;justify-content:center}
#prevImg{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#000}
aside{background:var(--sidebar);border-left:.5px solid var(--sep);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
h1{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0}p{margin:0;color:var(--label-2);font-size:12px}
.steps{display:flex;gap:6px}.step{flex:1;text-align:center;padding:5px 6px;border-radius:7px;background:var(--fill);color:var(--label-2);font-size:12px}
.step.on{background:var(--accent);color:#fff;font-weight:600}.step.done{color:var(--sys-green)}
aside button{min-height:30px;padding:5px 12px;border:.5px solid var(--control-border);border-radius:var(--radius-control);background:var(--control);color:var(--label);font-size:12px;font-weight:500;box-shadow:var(--control-shadow);cursor:pointer}
aside button.primary{background:var(--accent);color:#fff;border-color:transparent}
aside button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cand{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.cand.sel{box-shadow:inset 3px 0 0 var(--accent),var(--control-shadow)}
.cand .pct{margin-left:auto;color:var(--label-2);font-size:11.5px}
.sw{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}
.field{border:.5px solid var(--sep);border-radius:9px;padding:8px 10px;background:var(--content)}
.field.on{box-shadow:inset 3px 0 0 var(--c)}
.field label.t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.grid.three{grid-template-columns:repeat(3,1fr)}
.grid span{display:block;font-size:10.5px;color:var(--label-2)}
input[type=number]{width:100%;box-sizing:border-box;background:var(--control);color:var(--label);border:.5px solid var(--control-border);border-radius:6px;padding:3px 6px;font:inherit;font-size:12px}
#status{min-height:18px;font-size:12px;color:var(--label-2)}#status.ok{color:var(--sys-green)}#status.err{color:var(--sys-red)}
.home{display:flex;gap:12px;font-size:12.5px}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:60% auto}aside{border-left:0;border-top:.5px solid var(--sep)}}
</style></head><body>
<div id="app">
 <div id="main">
  <div id="stage"><canvas id="cv"></canvas><div id="banner" hidden></div><div id="coords"></div></div>
  <div id="preview"><p id="t_preview"></p><div id="prevWrap"><img id="prevImg" alt=""></div></div>
 </div>
 <aside>
  <h1 id="t_title"></h1>
  <div class="steps"><div id="st1" class="step on"></div><div id="st2" class="step"></div></div>
  <label class="row"><input id="overlay" type="checkbox" checked><span id="t_overlay"></span></label>
  <div id="p1">
   <p id="t_intro1"></p>
   <div id="cands" style="display:flex;flex-direction:column;gap:6px;margin:8px 0"></div>
   <div class="row"><button id="manual"></button></div>
   <div class="row" style="margin-top:8px"><span id="t_time"></span><input id="time" type="number" step="1" min="0" style="width:80px"><button id="rescan"></button></div>
   <div class="row" style="margin-top:10px"><button id="next" class="primary" disabled></button></div>
  </div>
  <div id="p2" hidden>
   <p id="t_intro2"></p>
   <div id="fields" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
   <p id="t_home" style="margin-top:4px;font-weight:600;color:var(--label)"></p>
   <div class="home"><label><input type="radio" name="home" value="left" checked> <span id="t_home_l"></span></label><label><input type="radio" name="home" value="right"> <span id="t_home_r"></span></label></div>
   <p id="t_home_hint"></p>
   <div class="row"><button id="propose"></button><button id="back"></button></div>
   <div class="row"><button id="save" class="primary"></button><button id="quit"></button></div>
  </div>
  <div id="status"></div>
  <p id="help"></p>
  <p id="t_priv"></p>
 </aside>
</div>
<script src="/i18n.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const COLORS = ['#ffd54f', '#4fc3f7', '#ff8a65', '#aed581'];
const DEFS = [
  { key: 'left_score', digits: 2, color: '#ff7043' },
  { key: 'right_score', digits: 2, color: '#42a5f5' },
  { key: 'clock', digits: 4, color: '#ffd54f' },
  { key: 'period', digits: 1, color: '#9ccc65' },
];
let INFO = null;
const F = {};
for (const d of DEFS) F[d.key] = { rect: null, digits: d.digits, gap_ratio: 0.25, slant: 0 };
const cv = $('cv'), ctx = cv.getContext('2d');
const view = { s: 1, ox: 0, oy: 0 };
const frameImg = new Image(), boardImg = new Image();
let step = 1, active = 'left_score', G = {}, overlay = true, tsn = 0;
const S = { cands: [], sel: -1, corners: null, size: null, valid: false, manual: null, fieldsFor: null };

const status = (m, c) => { const s = $('status'); s.textContent = m || ''; s.className = c || ''; };
const loadImg = (img, src) => new Promise((res) => { img.onload = res; img.onerror = res; img.src = src; });
const cur = () => step === 1 ? { img: frameImg, w: INFO.w, h: INFO.h } : { img: boardImg, w: S.size[0], h: S.size[1] };
const cornersKey = () => JSON.stringify(S.corners && S.corners.map((p) => p.map((v) => Math.round(v))));
const post = async (url, body) => (await fetch(url, { method: 'POST', body: JSON.stringify(body || {}) })).json();
const fieldLabel = (k) => T('sbp.f_' + k);

function texts() {
  document.title = T('sbp.title'); $('t_title').textContent = T('sbp.title');
  $('st1').textContent = '1 · ' + T('sbp.step1'); $('st2').textContent = '2 · ' + T('sbp.step2');
  $('t_overlay').textContent = T('sbp.overlay'); $('t_intro1').textContent = T('sbp.intro1'); $('t_intro2').textContent = T('sbp.intro2');
  $('manual').textContent = T('sbp.manual'); $('t_time').textContent = T('sbp.time'); $('rescan').textContent = T('sbp.rescan');
  $('next').textContent = T('sbp.next'); $('propose').textContent = T('sbp.propose'); $('back').textContent = T('sbp.back');
  $('save').textContent = T('sbp.save'); $('quit').textContent = T('sbp.quit'); $('t_preview').textContent = T('sbp.preview');
  $('t_home').textContent = T('sbp.home'); $('t_home_l').textContent = T('sbp.home_left'); $('t_home_r').textContent = T('sbp.home_right'); $('t_home_hint').textContent = T('sbp.home_hint');
  $('t_priv').textContent = T('calp.privacy');
}

function orderQuad(p) {
  const cx = p.reduce((a, q) => a + q[0], 0) / 4, cy = p.reduce((a, q) => a + q[1], 0) / 4;
  const v = p.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  let s = 0; for (let i = 1; i < 4; i++) if (v[i][0] + v[i][1] < v[s][0] + v[s][1]) s = i;
  return [v[s], v[(s + 1) % 4], v[(s + 2) % 4], v[(s + 3) % 4]];
}
function inPoly(pt, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}

// ---------- step 1: find the board
function buildCands(found) {
  S.cands = [];
  if (INFO.saved) S.cands.push({ label: T('sbp.saved'), corners: INFO.saved.corners, score: null });
  found.forEach((c, i) => S.cands.push({ label: T('sbp.hit', { n: i + 1 }), corners: c.corners, score: c.score }));
  renderCands();
}
function renderCands() {
  const root = $('cands'); root.innerHTML = '';
  if (!S.cands.length) { const p = document.createElement('p'); p.textContent = T('sbp.none'); root.appendChild(p); }
  S.cands.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'cand' + (i === S.sel ? ' sel' : '');
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.setProperty('--c', COLORS[i % 4]);
    const pct = document.createElement('span'); pct.className = 'pct'; pct.textContent = c.score == null ? '' : Math.round(c.score * 100) + ' %';
    b.append(sw, document.createTextNode(c.label), pct);
    b.onclick = () => selectCand(i);
    root.appendChild(b);
  });
  if (S.sel < 0 && S.corners) { const p = document.createElement('p'); p.textContent = T('sbp.own'); root.appendChild(p); }
}
function selectCand(i) { S.sel = i; S.corners = S.cands[i].corners.map((p) => p.slice()); S.manual = null; renderCands(); updateBoard(); draw(); }

let bt = null;
const boardSoon = () => { clearTimeout(bt); bt = setTimeout(updateBoard, 140); };
async function updateBoard() {
  if (!S.corners) return false;
  try {
    const j = await post('/api/board', { corners: S.corners }); if (!j.ok) throw new Error(j.error);
    S.size = j.size; S.valid = true;
    $('prevImg').src = `/board.jpg?mode=${overlay ? 'max' : 'best'}&ts=${++tsn}`;
    $('next').disabled = false; status('');
    return true;
  } catch (e) { S.valid = false; $('next').disabled = true; status(T('sbp.bad_corners') + ' ' + e.message, 'err'); return false; }
}

// ---------- view
function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
}
function fitScale() { const r = cv.getBoundingClientRect(), c = cur(); return Math.min(r.width / c.w, r.height / c.h) * 0.98; }
function fit() {
  if (!INFO) return;
  const r = cv.getBoundingClientRect(), c = cur();
  view.s = fitScale();
  view.ox = (r.width - c.w * view.s) / 2; view.oy = (r.height - c.h * view.s) / 2;
}
// Never zoomed out beyond the whole picture and never slid out of the window: centred along an axis
// where it is narrower than the window, otherwise it always fills it.
function clampView() {
  if (!INFO) return;
  const r = cv.getBoundingClientRect(), c = cur(), m = fitScale();
  view.s = Math.min(Math.max(view.s, m), m * 60);
  const ax = (o, size, v) => size <= v ? (v - size) / 2 : Math.min(0, Math.max(v - size, o));
  view.ox = ax(view.ox, c.w * view.s, r.width); view.oy = ax(view.oy, c.h * view.s, r.height);
}
const toScr = (x, y) => [x * view.s + view.ox, y * view.s + view.oy];
function poly(pts, color, lw, dash) {
  ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = toScr(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
}
function handle(p, color, label) {
  const [x, y] = toScr(p[0], p[1]);
  ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#000'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y + 0.5);
}
function draw() {
  const r = cv.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height);
  if (!INFO) return;
  const c = cur();
  ctx.imageSmoothingEnabled = view.s < 2;
  if (c.img.complete && c.img.naturalWidth) ctx.drawImage(c.img, view.ox, view.oy, c.w * view.s, c.h * view.s);
  const b = $('banner');
  if (step === 1) {
    S.cands.forEach((cd, i) => { if (i !== S.sel) poly(cd.corners, COLORS[i % 4], 1.5, [6, 4]); });
    if (S.corners) { poly(S.corners, '#ffd54f', 2.5); S.corners.forEach((p, i) => handle(p, '#ffd54f', String(i + 1))); }
    if (S.manual) S.manual.forEach((p, i) => handle(p, '#ff7043', String(i + 1)));
    if (S.manual) { b.hidden = false; b.textContent = T('sbp.manual_banner', { n: 4 - S.manual.length }); }
    else if (!S.corners) { b.hidden = false; b.textContent = S.cands.length ? T('sbp.pick') : T('sbp.none'); }
    else b.hidden = true;
  } else {
    b.hidden = true;
    for (const d of DEFS) {
      const f = F[d.key]; if (!f.rect) continue;
      const on = d.key === active;
      ctx.strokeStyle = d.color; ctx.lineWidth = on ? 2 : 1; ctx.globalAlpha = on ? 1 : 0.75;
      const [x, y] = toScr(f.rect[0], f.rect[1]);
      ctx.strokeRect(x, y, f.rect[2] * view.s, f.rect[3] * view.s); ctx.lineWidth = 1;
      for (const dig of (G[d.key] || [])) for (const s of dig) {
        const [sx, sy] = toScr(s[0], s[1]);
        ctx.strokeRect(sx, sy, (s[2] - s[0]) * view.s, (s[3] - s[1]) * view.s);
      }
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- step 2: digit blocks
const root = $('fields');
const PROPS = [['x', 'sbp.x'], ['y', 'sbp.y'], ['w', 'sbp.w'], ['h', 'sbp.h']];
function buildFields() {
  root.innerHTML = '';
  for (const d of DEFS) {
    const el = document.createElement('div');
    el.className = 'field'; el.id = 'f_' + d.key; el.style.setProperty('--c', d.color);
    const cell = (p, label, attrs) => `<div><span>${label}</span><input type="number" ${attrs} data-k="${d.key}" data-p="${p}"></div>`;
    el.innerHTML = `<label class="t"><input type="radio" name="act" value="${d.key}"><span class="sw"></span><span class="lbl"></span></label>
      <div class="grid">${PROPS.map(([p, k]) => cell(p, T(k), 'step="0.5"')).join('')}</div>
      <div class="grid three">${cell('digits', T('sbp.digits'), 'min="1" max="6" step="1"')}${cell('gap_ratio', T('sbp.gap'), 'step="0.01"')}${cell('slant', T('sbp.slant'), 'step="0.01"')}</div>`;
    el.querySelector('.lbl').textContent = fieldLabel(d.key);
    root.appendChild(el);
  }
}
root.addEventListener('change', (e) => { if (e.target.name === 'act') { active = e.target.value; markActive(); draw(); } });
root.addEventListener('input', (e) => {
  const t = e.target; if (!t.dataset.k) return;
  const f = F[t.dataset.k], p = t.dataset.p, v = parseFloat(t.value);
  if (isNaN(v)) return;
  if (['x', 'y', 'w', 'h'].includes(p)) { if (!f.rect) return; f.rect[{ x: 0, y: 1, w: 2, h: 3 }[p]] = v; }
  else f[p] = p === 'digits' ? Math.max(1, Math.min(6, Math.round(v))) : v;
  geo();
});
root.addEventListener('focusin', (e) => { const f = e.target.closest('.field'); if (!f) return; active = f.id.slice(2); markActive(); draw(); });
function markActive() {
  for (const d of DEFS) {
    $('f_' + d.key).classList.toggle('on', d.key === active);
    document.querySelector(`#f_${d.key} input[type=radio]`).checked = d.key === active;
  }
}
function sync() {
  for (const inp of root.querySelectorAll('input[data-k]')) {
    if (inp === document.activeElement) continue;
    const f = F[inp.dataset.k], p = inp.dataset.p;
    const v = ['x', 'y', 'w', 'h'].includes(p) ? (f.rect ? f.rect[{ x: 0, y: 1, w: 2, h: 3 }[p]] : '') : f[p];
    inp.value = v === '' ? '' : Math.round(v * 100) / 100;
  }
}
let geoTimer = null;
function geo() {
  sync(); draw(); clearTimeout(geoTimer);
  geoTimer = setTimeout(async () => {
    const fields = {}; for (const k in F) if (F[k].rect) fields[k] = F[k];
    try { G = await post('/api/geometry', { fields }); draw(); } catch (e) {}
  }, 60);
}
async function propose() {
  status(T('sbp.proposing'));
  try {
    const j = await post('/api/propose'); if (!j.ok) throw new Error(j.error);
    let n = 0; for (const k in j.fields) if (F[k]) { Object.assign(F[k], j.fields[k]); n++; }
    status(n ? T('sbp.proposed', { n }) : T('sbp.proposed_none'), n ? 'ok' : 'err');
  } catch (e) { status(e.message, 'err'); }
  geo();
}

// ---------- steps
function showStep(n) {
  step = n;
  $('p1').hidden = n !== 1; $('p2').hidden = n !== 2; $('preview').hidden = n !== 1;
  $('st1').className = 'step' + (n === 1 ? ' on' : ' done'); $('st2').className = 'step' + (n === 2 ? ' on' : '');
  $('help').textContent = n === 1 ? T('sbp.help1') : T('sbp.help2');
  resize();
}
$('next').onclick = async () => {
  if (!(await updateBoard())) return;
  showStep(2);
  await loadImg(boardImg, `/board.jpg?mode=${overlay ? 'max' : 'best'}&ts=${++tsn}`);
  fit(); markActive();
  const key = cornersKey();
  if (S.fieldsFor !== key) { for (const k in F) F[k].rect = null; S.fieldsFor = key; await propose(); } else { sync(); geo(); }
  draw();
};
$('back').onclick = () => { showStep(1); fit(); draw(); };
$('propose').onclick = () => propose();
$('overlay').onchange = async (e) => {
  overlay = e.target.checked;
  await loadImg(frameImg, `/frame.jpg?mode=${overlay ? 'max' : 'single'}&ts=${++tsn}`);
  if (S.valid) {
    $('prevImg').src = `/board.jpg?mode=${overlay ? 'max' : 'best'}&ts=${++tsn}`;
    if (step === 2) await loadImg(boardImg, `/board.jpg?mode=${overlay ? 'max' : 'best'}&ts=${++tsn}`);
  }
  draw();
};
$('manual').onclick = () => { S.manual = []; S.sel = -1; S.corners = null; S.valid = false; $('next').disabled = true; renderCands(); draw(); };
$('rescan').onclick = async () => {
  status(T('sbp.scanning'));
  try {
    const j = await post('/api/scan', { time: parseFloat($('time').value) || 0 }); if (!j.ok) throw new Error(j.error);
    await loadImg(frameImg, `/frame.jpg?mode=${overlay ? 'max' : 'single'}&ts=${++tsn}`);
    S.sel = -1; S.corners = null; S.valid = false; $('next').disabled = true; INFO.saved = null; S.fieldsFor = null;
    buildCands(j.candidates);
    if (S.cands.length) selectCand(0); else draw();
    status(j.candidates.length ? '' : T('sbp.none'), j.candidates.length ? '' : 'err');
  } catch (e) { status(e.message, 'err'); }
};
$('save').onclick = async () => {
  const fields = {}; for (const k in F) if (F[k].rect) fields[k] = F[k];
  for (const k of ['left_score', 'right_score', 'clock']) if (!fields[k]) return status(T('sbp.missing', { f: fieldLabel(k) }), 'err');
  const home = document.querySelector('input[name=home]:checked').value;
  try {
    const j = await post('/api/save', { corners: S.corners, fields, home }); if (!j.ok) throw new Error(j.error);
    status(T('sbp.saved_ok'), 'ok');
  } catch (e) { status(e.message, 'err'); }
};
$('quit').onclick = async () => { try { await post('/api/quit'); } catch (e) {} status(T('sbp.closed'), 'ok'); };

// ---------- mouse and keyboard
let drag = null, spaceDown = false;
const rectOf = () => cv.getBoundingClientRect();
const imgPos = (e) => { const r = rectOf(); return [(e.clientX - r.left - view.ox) / view.s, (e.clientY - r.top - view.oy) / view.s]; };
cv.addEventListener('contextmenu', (e) => e.preventDefault());
cv.addEventListener('mousedown', (e) => {
  if (e.button === 1 || e.button === 2 || spaceDown) { drag = { pan: true, x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy }; return; }
  if (e.button !== 0 || !INFO) return;
  const p = imgPos(e);
  if (step === 1) {
    if (S.manual) {
      S.manual.push(p);
      if (S.manual.length === 4) { S.corners = orderQuad(S.manual); S.manual = null; S.sel = -1; renderCands(); updateBoard(); }
      draw(); return;
    }
    if (S.corners) {
      const r = rectOf();
      for (let i = 0; i < 4; i++) {
        const [sx, sy] = toScr(S.corners[i][0], S.corners[i][1]);
        if (Math.hypot(sx - (e.clientX - r.left), sy - (e.clientY - r.top)) <= 12) { drag = { corner: i }; return; }
      }
    }
    const hit = S.cands.findIndex((c, i) => i !== S.sel && inPoly(p, c.corners));
    if (hit >= 0) selectCand(hit);
  } else drag = { p0: p };
});
window.addEventListener('mousemove', (e) => {
  const r = rectOf();
  if (INFO && e.clientX >= r.left && e.clientY >= r.top && e.clientX <= r.right && e.clientY <= r.bottom) {
    const p = imgPos(e); $('coords').textContent = `x ${p[0].toFixed(0)}  y ${p[1].toFixed(0)}`;
  }
  if (!drag) return;
  if (drag.pan) { view.ox = drag.ox + e.clientX - drag.x; view.oy = drag.oy + e.clientY - drag.y; clampView(); draw(); return; }
  const p = imgPos(e);
  if (drag.corner !== undefined) {
    S.corners[drag.corner] = [Math.max(0, Math.min(INFO.w - 1, p[0])), Math.max(0, Math.min(INFO.h - 1, p[1]))];
    S.sel = -1; draw(); boardSoon(); return;
  }
  const x0 = Math.min(drag.p0[0], p[0]), y0 = Math.min(drag.p0[1], p[1]);
  const w = Math.abs(p[0] - drag.p0[0]), h = Math.abs(p[1] - drag.p0[1]);
  if (w > 2 && h > 2) { F[active].rect = [x0, y0, w, h]; geo(); }
});
window.addEventListener('mouseup', () => { if (drag && drag.corner !== undefined) { renderCands(); updateBoard(); } drag = null; });
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0015), m = fitScale(), ns = Math.max(m, Math.min(m * 60, view.s * k));
  view.ox = e.offsetX - (e.offsetX - view.ox) * ns / view.s; view.oy = e.offsetY - (e.offsetY - view.oy) * ns / view.s;
  view.s = ns; clampView(); draw();
}, { passive: false });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) { spaceDown = true; e.preventDefault(); }
  if (e.key === 'Escape' && S.manual) { S.manual = null; draw(); }
  if (e.key === 'f' && e.target === document.body) { fit(); draw(); }
  if (step !== 2) return;
  const f = F[active];
  if (!f.rect || !e.key.startsWith('Arrow') || ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  const st = e.shiftKey ? 10 : 1;
  const dx = e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0;
  const dy = e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0;
  if (e.altKey) { f.rect[2] = Math.max(2, f.rect[2] + dx); f.rect[3] = Math.max(2, f.rect[3] + dy); } else { f.rect[0] += dx; f.rect[1] += dy; }
  e.preventDefault(); geo();
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space') spaceDown = false; });
window.addEventListener('resize', () => { fit(); resize(); });

// ---------- start
(async () => {
  INFO = await (await fetch('/api/info')).json();
  if (INFO.lang) setLang(INFO.lang);
  texts(); buildFields();
  if (INFO.fields) for (const k in INFO.fields) if (F[k]) Object.assign(F[k], INFO.fields[k]);
  const hr = document.querySelector(`input[name=home][value=${INFO.home === 'right' ? 'right' : 'left'}]`); if (hr) hr.checked = true;
  $('time').value = Math.round(INFO.time);
  showStep(1);
  await loadImg(frameImg, `/frame.jpg?mode=max&ts=${++tsn}`);
  buildCands(INFO.candidates);
  fit(); draw();
  if (S.cands.length) { selectCand(0); if (INFO.saved) S.fieldsFor = cornersKey(); }
})();
</script>
