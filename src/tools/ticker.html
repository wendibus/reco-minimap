<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>reco-minimap ticker</title>
<style>
:root{color-scheme:dark light}
html,body{margin:0}
body{background:#10141a;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:light){body{background:#eef1f4}}
body.embed{background:transparent}
#app{max-width:640px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
body.embed #app{padding:0;max-width:none}
</style>
</head>
<body>
<div id="app"></div>
<!--TICKER-SCRIPT-->
<script>
(function () {
  const Q = new URLSearchParams(location.search), embed = Q.get('embed') === '1';
  const admin = location.pathname.startsWith('/ticker/admin');
  const meta = document.querySelector('meta[name=ticker-static]');
  if (embed) document.body.classList.add('embed');
  if (Q.get('theme') === 'light' || Q.get('theme') === 'dark') document.body.style.background = embed ? 'transparent' : (Q.get('theme') === 'dark' ? '#10141a' : '#eef1f4');
  let t = null;
  t = RecoTicker.mount(document.getElementById('app').attachShadow({ mode: 'open' }), {
    feed: Q.get('feed') || (meta ? 'ticker.json' : '/ticker.json'),
    incremental: !meta && !Q.get('feed'),
    admin: admin ? location.origin : false,
    lang: Q.get('lang') || '', show: Q.get('show') || '', max: parseInt(Q.get('max')) || 0, embed, theme: Q.get('theme') || 'auto',
    onDraw() {
      if (t) document.title = t.title();
      // an iframe on another web page asks for its height so it never needs a scroll bar
      if (embed && window.parent !== window) parent.postMessage({ type: 'reco-ticker-height', height: document.getElementById('app').scrollHeight }, '*');
    }
  });
  document.title = t.title();
})();
</script>
</body>
</html>
